name: Release iOS to TestFlight (disabled)

# Fork iOS releases build locally on the macmini runner:
# .github/workflows/app-ios-release.yml. This file exists only to shadow
# upstream's push-triggered workflow so fork tags never consume EAS build credits.
on:
  workflow_dispatch:

jobs:
  cloud_build_disabled:
    type: build
    params:
      platform: ios
      profile: production
    hooks:
      before_install_node_modules:
        - run: |
            echo "EAS cloud builds are disabled for fork releases; see .github/workflows/app-ios-release.yml" >&2
            exit 1
          working_directory: .
