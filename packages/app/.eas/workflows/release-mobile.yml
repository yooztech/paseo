name: Release iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
      source_commit:
        type: string
        required: true

jobs:
  build_ios:
    type: build
    env:
      PASEO_RELEASE_TAG: ${{ inputs.release_tag }}
      PASEO_SOURCE_COMMIT: ${{ inputs.source_commit }}
      APP_VARIANT: production
    params:
      platform: ios
      profile: production
    hooks:
      before_install_node_modules:
        - run: node ../../scripts/fork/eas-build.mjs
          working_directory: .

  submit_ios:
    type: submit
    needs: [build_ios]
    env:
      PASEO_RELEASE_TAG: ${{ inputs.release_tag }}
      PASEO_SOURCE_COMMIT: ${{ inputs.source_commit }}
      APP_VARIANT: production
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
    hooks:
      after_checkout:
        - run: node ../../scripts/fork/eas-build.mjs
          working_directory: .
